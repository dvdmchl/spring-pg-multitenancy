name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Checkstyle, SpotBugs, tests (Testcontainers uses the runner's Docker) and the JaCoCo coverage gate
      - name: Build and verify
        run: mvn -B -ntp verify
